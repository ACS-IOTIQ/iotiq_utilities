name: Deploy to IOT_UTILITY_SERVER

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.IOT_UTILITY_PEM_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.IOT_UTILITY_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to IOT_UTILITY_BACKEND_SERVER
      env: 
        ENV_CONTENT: ${{ secrets.ENV }}
      run: |
        SSH_TARGET="${{ secrets.IOT_UTILITY_USER }}@${{ secrets.IOT_UTILITY_HOST }}"

        # Refuse to wipe the server's .env if the secret is missing
        if [ -z "$ENV_CONTENT" ]; then
          echo "::error::secrets.ENV is empty - aborting so the server .env is not overwritten"
          exit 1
        fi

        # Send .env over stdin (variables in a quoted heredoc are NOT expanded,
        # which previously wrote an empty .env on the server)
        printf '%s\n' "$ENV_CONTENT" | ssh -o StrictHostKeyChecking=no "$SSH_TARGET" 'cat > ~/iotiq_utilities/backend/.env'

        ssh -o StrictHostKeyChecking=no "$SSH_TARGET" << 'EOF'
          set -e
          cd ~/iotiq_utilities/scripts/backend
          chmod +x deploy.sh
          ./deploy.sh
        EOF
